# Builds the VST3 in vst/ on Windows on every push that touches it; the plugin is a download on the run.
name: VST

on:
  push:
    branches: [main]
    paths: [vst/**, .github/workflows/vst.yml]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vst/web/package-lock.json

      # The web app the plugin shows: tested, built, and zipped into the plugin.
      - name: Web app
        working-directory: vst/web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npx vite build
          Compress-Archive -Path dist/* -DestinationPath "${{ runner.temp }}\web.zip"

      # JUCE links WebView2 statically and looks for the NuGet package here.
      - name: WebView2 SDK
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory "${{ runner.temp }}\nuget"

      - name: Configure
        run: cmake -S vst -B vst/build -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ runner.temp }}\nuget" "-DBREAKSEQ_WEB_ZIP=${{ runner.temp }}\web.zip"

      # Compiler errors also go up as annotations, so they can be read without signing in.
      - name: Build
        run: |
          cmake --build vst/build --config Release --parallel 2>&1 | Tee-Object -FilePath "${{ runner.temp }}\build.log"
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path "${{ runner.temp }}\build.log" -Pattern ': (fatal )?error ' | Select-Object -First 30 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: C++ tests
        run: vst/build/BreakseqTests_artefacts/Release/BreakseqTests.exe

      # The picture of the plugin hosts may show in their lists (VST3 snapshot), named by the plugin's class id.
      - name: Snapshot
        run: |
          $resources = "vst/build/Breakseq_artefacts/Release/VST3/Breakseq.vst3/Contents/Resources"
          if (-not (Test-Path "$resources/moduleinfo.json")) { Write-Output "::error::The bundle has no moduleinfo.json"; exit 1 }
          $info = Get-Content "$resources/moduleinfo.json" -Raw | ConvertFrom-Json
          $cid = ($info.Classes | Where-Object { $_.Category -eq 'Audio Module Class' } | Select-Object -First 1).CID
          if (-not $cid) { Write-Output "::error::No Audio Module Class in moduleinfo.json"; exit 1 }
          New-Item -ItemType Directory -Force "$resources/Snapshots" | Out-Null
          Copy-Item vst/resources/snapshot.png "$resources/Snapshots/${cid}_snapshot.png"
          Copy-Item vst/resources/snapshot_2.0x.png "$resources/Snapshots/${cid}_snapshot_2.0x.png"
          Write-Output "::notice::Snapshot for class $cid"

      - uses: actions/upload-artifact@v6
        with:
          name: Breakseq-vst3
          path: vst/build/Breakseq_artefacts/Release/VST3/

      - uses: actions/upload-artifact@v6
        with:
          name: Breakseq-standalone
          path: vst/build/Breakseq_artefacts/Release/Standalone/
